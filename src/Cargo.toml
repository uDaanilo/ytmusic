[package]
name = "ytmusic"
version = "2.0.2"
description = "A youtube music app"
authors = ["uDaanilo"]
license = "MIT"
repository = "https://github.com/uDaanilo/ytmusic"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
log = "0.4"
tokio = { version = "1", features = ["sync", "time", "net", "macros"] }
socketioxide = "0.18"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
discord-rich-presence = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
